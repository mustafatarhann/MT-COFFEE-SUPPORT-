name: APK Oluştur

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Gradle Onbellegini Temizle ve Bagimliliklari Yukle
        run: |
          rm -rf ~/.gradle/caches/
          flutter pub get

      - name: APK Yapısını Yükle
        run: flutter build apk --release --no-pub

      - name: Artifacts Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
