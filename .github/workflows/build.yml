name: APK Oluştur

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java Kurulumu (Java 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Flutter SDK Yukle ve Ayarla
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.24.0 --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter doctor

      - name: Gradle Onbellegini Temizle ve Bagimliliklari Yukle
        run: |
          rm -rf ~/.gradle
          flutter pub get

      - name: APK Olustur
        run: flutter build apk --release --no-pub

      - name: Artifacts Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
