name: APK Oluştur

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java Kurulumu (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter SDK Yukle, Izole Et ve APK Olustur
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.24.0 --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          
          flutter doctor
          
          # Gradle önbelleğini izole bir klasöre alarak çakışmayı önliyoruz
          export GRADLE_USER_HOME=$(mktemp -d)
          
          flutter pub get
          flutter build apk --release --no-pub

      - name: Artifacts Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
