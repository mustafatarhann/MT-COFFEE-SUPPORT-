name: APK Oluştur

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Java ve Flutter Ortamını Hazirla
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version
          
          git clone https://github.com/flutter/flutter.git -b 3.24.0 --depth 1 _flutter
          echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH
          flutter doctor

      - name: Bağımlılıkları Yükle
        run: flutter pub get

      - name: APK Derle
        run: flutter build apk --release

      - name: APK'yı Yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
